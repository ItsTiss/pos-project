services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmacy_pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://pos:pos@db:5432/pharmacy_pos
    depends_on:
      - db

volumes:
  db_data:
